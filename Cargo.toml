[package]
name = "ascendio"
version = "0.1.0"
edition = "2021"
description = "Incremental game: unlock the phylogenomic tree of animal life, one tap at a time."
license = "MIT"

[dependencies]
macroquad = "0.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# Persistent key-value storage: browser localStorage on wasm, a local JSON
# file (`local.data`) natively -- one API for both, so `save.rs` needs no
# platform branching of its own.
quad-storage = "0.1.3"

# Small, fast binaries matter on Android.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1

# Used by `cargo quad-apk` (`make apk`). 31 is the newest platform the
# notfl3/cargo-apk image has.
[package.metadata.android]
package_name = "com.ascendio.game"
label = "Ascendio"
build_targets = ["aarch64-linux-android", "armv7-linux-androideabi"]
target_sdk_version = 31
min_sdk_version = 24
fullscreen = true

[package.metadata.android.activity_attributes]
"android:screenOrientation" = "portrait"
