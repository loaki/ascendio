[package]
name = "ascendio"
version = "0.1.0"
edition = "2021"
description = "Incremental game: unlock the phylogenomic tree of animal life, one tap at a time."
license = "MIT"

[dependencies]
macroquad = "0.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Browser localStorage for the save. Natively platform/save.rs writes a file
# itself: quad-storage's file writes aren't atomic and it panics on bad files.
quad-storage = "0.1.3"
# Strings to and from web/ascendio.js (platform/net.rs); version follows quad-storage.
sapp-jsutils = "0.1.7"

# Small, fast binaries matter on Android.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1

# Used by `cargo quad-apk` (`make apk`). It compiles against android-31, the
# platform in the image; the target SDK is what Play Protect checks, and
# anything below the newest release gets an "older version of Android" warning.
[package.metadata.android]
# cargo-quad-apk loads the native library named after the last segment, so it
# must end in the crate name (`.ascendio`) or the app crashes on launch.
package_name = "com.loaki.ascendio"
label = "Ascendio"
build_targets = ["aarch64-linux-android", "armv7-linux-androideabi"]
target_sdk_version = 36
min_sdk_version = 24
# Keep the phone's status bar; the wrapper pads the game below it.
fullscreen = false
# Generated by scripts/pixel-art/icon.py.
res = "android/res"
icon = "@mipmap/ic_launcher"

# Android 12+ refuses to install an app whose launcher activity doesn't say
# whether it's exported.
[package.metadata.android.activity_attributes]
"android:exported" = "true"
"android:icon" = "@mipmap/ic_launcher"
"android:screenOrientation" = "portrait"
# Dark, no title bar: light status-bar icons over the game's dark top bar.
"android:theme" = "@android:style/Theme.DeviceDefault.NoActionBar"

# The "genome ready" notification (platform/notify.rs, quad.toml): Android 13+
# asks the player before the app may post one, and the scheduled job survives
# a reboot. Its job service is declared in quad.toml.
[[package.metadata.android.permission]]
name = "android.permission.POST_NOTIFICATIONS"

[[package.metadata.android.permission]]
name = "android.permission.RECEIVE_BOOT_COMPLETED"

# The leaderboard (platform/net.rs, server/).
[[package.metadata.android.permission]]
name = "android.permission.INTERNET"
